- title: In-hospital Mortality Prediction
  description: >
    End-to-end ML pipeline predicting in-hospital mortality, with a Streamlit app
    deployed on Google Cloud, CI/CD via GitHub Actions, and live model monitoring
    using Evidently AI and Grafana.
  tags: [MLflow, Mage, Docker, GCP, Evidently AI, Grafana, Streamlit]
  github: https://github.com/Tobai24/In-Hospital-Mortality-Prediction

- title: Computer Vision Projects
  description: >
    A collection of computer vision work: a real-time face recognition system
    (MTCNN + InceptionResnetV1) and a medical imaging model for polyp detection in
    gastrointestinal images, fine-tuned on YOLOv11 to assist early diagnosis.
  tags: [PyTorch, OpenCV, YOLOv11, MTCNN, InceptionResnetV1]
  github: https://github.com/Tobai24/Computer_vision

- title: Logos
  description: >
    An end-to-end RAG application for scripture-based Q&A, with an evaluation
