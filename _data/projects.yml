    to interpret requests and generate insights.
  tags: [LangGraph, OpenAI API, Agents]
  github: https://github.com/Tobai24/Data_analyst_agent

- title: LLM Finetuning
  description: >
    Fine-tuned Meta's LLaMA 3 on a medical QA dataset for stronger clinical and
