    for retrieval optimization.
  tags: [RAG, Elasticsearch, MiniSearch, OpenAI API]
  github: https://github.com/Tobai24/logos

- title: Data Analyst AI Agent
  description: >
    An AI-powered data analyst agent that performs automated data exploration,
